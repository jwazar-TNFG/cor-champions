        .header p { color: var(--text-muted); margin-top: 5px; }
        .badge {

        .chart h3 { margin-bottom: 15px; font-size: 1rem; }
        .bars { display: flex; align-items: flex-end; gap: 15px; height: 150px; }
        .bar-wrap { flex: 1; text-align: center; }
        .bar {

        .bar:hover { opacity: 0.8; }
        .bar-val { font-weight: 700; font-size: 0.85rem; margin-bottom: 5px; }
        .bar-lbl { color: var(--text-muted); font-size: 0.75rem; margin-top: 8px; }
        
        .podium { display: flex; justify-content: center; gap: 20px; padding: 30px 0; align-items: flex-end; }
        .place { text-align: center; }
        .avatar {
            width: 60px; height: 60px; border-radius: 50%; background: var(--bg-card);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 1.2rem; margin: 0 auto 8px; border: 3px solid;

        .place.p1 .avatar { width: 80px; height: 80px; border-color: var(--gold); box-shadow: 0 0 20px rgba(255,215,0,0.4); }

        .place.p3 .avatar { border-color: var(--bronze); }
        .place .name { font-weight: 700; }
        .place .cases { color: var(--green); font-weight: 600; font-size: 1.1rem; }
        .place .medal { font-size: 1.5rem; margin-bottom: 5px; }
        .stand { width: 80px; border-radius: 8px 8px 0 0; margin-top: 10px; }
        .place.p1 .stand { background: rgba(255,215,0,0.2); height: 100px; }
        .place.p2 .stand { background: rgba(192,192,192,0.2); height: 70px; }
        .place.p3 .stand { background: rgba(205,127,50,0.2); height: 50px; }
        
        .leaderboard {
            background: var(--bg-card); border-radius: 16px; overflow: hidden; margin-top: 20px;
        }
        .row {
            display: grid; grid-template-columns: 50px 1fr 80px;
            padding: 14px 20px; border-bottom: 1px solid rgba(255,255,255,0.05);

        .row:hover { background: rgba(0,200,83,0.1); }
        .row.hdr { background: rgba(0,0,0,0.3); font-weight: 600; color: var(--text-muted); font-size: 0.75rem; }
        .rank { font-weight: 700; }
        .info { display: flex; align-items: center; gap: 10px; }
        .sm-avatar {

            background: linear-gradient(135deg, #0066CC, #004494);

</head>
