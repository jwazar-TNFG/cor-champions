    <style>
        :root {
            --gold: #FFD700;
            --silver: #C0C0C0;
            --bronze: #CD7F32;
            --cor-blue: #0066CC;
            --cor-dark: #004494;
            --green: #00C853;
            --bg-dark: #0a1628;
            --bg-card: #1a2744;
            --text-light: #ffffff;
            --text-muted: #8899aa;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a2744 100%);
            min-height: 100vh;
            color: var(--text-light);
        }
        
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        
        .header { text-align: center; padding: 30px 0; }
        .header h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--gold), #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .header .subtitle { font-size: 1.2rem; color: var(--text-muted); }
        
        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 200, 83, 0.2);
            border: 1px solid var(--green);
            padding: 8px 16px;
            border-radius: 20px;
            margin-top: 15px;
            font-size: 0.9rem;
        }
        .live-dot {
            width: 10px; height: 10px;
            background: var(--green);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
        
        /* Filter Controls */
        .filter-section {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }
        .filter-label { font-weight: 600; color: var(--text-muted); }
        .quick-filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-light);
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        .filter-btn:hover { background: rgba(0, 102, 204, 0.3); }
        .filter-btn.active {
            background: var(--cor-blue);
            border-color: var(--cor-blue);
        }
        .month-select {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-light);
            padding: 10px 20px;
            border-radius: 25px;
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .month-select option { background: var(--bg-dark); }
        
        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .stat-card .number { font-size: 2rem; font-weight: 800; color: var(--cor-blue); }
        .stat-card .label { color: var(--text-muted); font-size: 0.85rem; margin-top: 5px; }
        .stat-card.highlight .number {
            background: linear-gradient(135deg, var(--gold), #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        /* Monthly Trend Chart */
        .trend-section {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .trend-section h3 { margin-bottom: 20px; }
        .trend-chart {
            display: flex;
            align-items: flex-end;
            gap: 15px;
            height: 200px;
            padding: 20px 0;
        }
        .trend-bar {
            flex: 1;
            background: linear-gradient(180deg, var(--cor-blue), var(--cor-dark));
            border-radius: 8px 8px 0 0;
            position: relative;
            min-width: 50px;
            transition: all 0.3s;
            cursor: pointer;
        }
        .trend-bar:hover { background: linear-gradient(180deg, var(--green), var(--cor-blue)); }
        .trend-bar .value {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-weight: 700;
            font-size: 0.9rem;
        }
        .trend-bar .month-label {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            color: var(--text-muted);
            white-space: nowrap;
        }
        
        /* Podium */
        .podium { display: flex; justify-content: center; align-items: flex-end; gap: 20px; padding: 40px 0; }
        .podium-place { text-align: center; transition: transform 0.3s; }
        .podium-place:hover { transform: scale(1.05); }
        .podium-avatar {
            width: 70px; height: 70px;
            border-radius: 50%;
            background: var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0 auto 10px;
            border: 4px solid;
        }
        .podium-place.first .podium-avatar {
            width: 90px; height: 90px;
            border-color: var(--gold);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
        }
        .podium-place.second .podium-avatar { border-color: var(--silver); }
        .podium-place.third .podium-avatar { border-color: var(--bronze); }
        .podium-name { font-weight: 700; font-size: 1rem; margin-bottom: 5px; }
        .podium-cases { color: var(--green); font-weight: 600; font-size: 1.1rem; }
        .rank-badge { font-size: 1.8rem; margin-bottom: 8px; }
        .podium-stand {
            width: 100px;
            padding: 15px;
            border-radius: 12px 12px 0 0;
            margin-top: 15px;
        }
        .podium-place.first .podium-stand { background: linear-gradient(180deg, rgba(255,215,0,0.3), rgba(255,215,0,0.1)); height: 140px; }
        .podium-place.second .podium-stand { background: linear-gradient(180deg, rgba(192,192,192,0.3), rgba(192,192,192,0.1)); height: 100px; }
        .podium-place.third .podium-stand { background: linear-gradient(180deg, rgba(205,127,50,0.3), rgba(205,127,50,0.1)); height: 70px; }
        
        /* Leaderboard */
        .leaderboard-section h2 { text-align: center; margin-bottom: 20px; font-size: 1.5rem; }
        .leaderboard {
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .leaderboard-row {
            display: grid;
            grid-template-columns: 50px 1fr 100px 80px;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: background 0.3s;
        }
        .leaderboard-row:hover { background: rgba(0, 102, 204, 0.1); }
        .leaderboard-row.header {
            background: rgba(0,0,0,0.3);
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
        }
        .rank { font-size: 1.1rem; font-weight: 700; }
        .rank.top-3 { font-size: 1.3rem; }
        .intaker-info { display: flex; align-items: center; gap: 12px; }
        .intaker-avatar {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--cor-blue), var(--cor-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .intaker-name { font-weight: 600; }
        .progress-bar { height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--cor-blue), var(--green)); border-radius: 4px; }
        .cases-count { font-weight: 700; font-size: 1.1rem; color: var(--green); text-align: right; }
        
        .footer { text-align: center; padding: 30px; color: var(--text-muted); font-size: 0.85rem; }
        
        @media (max-width: 768px) {
            .header h1 { font-size: 2rem; }
            .podium { flex-direction: column; align-items: center; }
            .podium-place { order: 2; }
            .podium-place.first { order: 1; }
            .leaderboard-row { grid-template-columns: 40px 1fr 60px; }
            .progress-bar { display: none; }
            .trend-chart { overflow-x: auto; }
        }
    </style>
</head>

            data.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'leaderboard-row';
                
                const rankEmoji = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : item.rank;
                const progressWidth = (item.cases / maxCases) * 100;
                
                row.innerHTML = `
                    <div class="rank ${index < 3 ? 'top-3' : ''}">${rankEmoji}</div>
                    <div class="intaker-info">
                        <div class="intaker-avatar">${item.initials}</div>
                        <div class="intaker-name">${item.name}</div>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${progressWidth}%"></div>
                    </div>
                    <div class="cases-count">${item.cases}</div>
                `;
                container.appendChild(row);
            });
            
            // Update stats
            const total = data.reduce((sum, d) => sum + d.cases, 0);
            document.getElementById('statTotal').textContent = total.toLocaleString();
            document.getElementById('statIntakers').textContent = data.length;
            document.getElementById('statAvg').textContent = data.length > 0 ? Math.round(total / data.length) : 0;
        }
        
        function selectFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`[data-filter="${filter}"]`).classList.add('active');
            document.getElementById('monthSelect').value = '';
            
            let data, title;
            
            switch(filter) {
                case 'ytd':
                    data = ytdData;
                    title = '📊 YTD Rankings';
                    break;
                case 'current':
                    data = monthlyData[currentMonth] || [];
                    title = '📊 This Month Rankings';
                    break;
                case 'last':
                    data = monthlyData[lastMonth] || [];
                    title = '📊 Last Month Rankings';
                    break;
            }
            
            renderPodium(data);
            renderLeaderboard(data, title);
        }
        
        function selectMonth(month) {
            currentFilter = 'month';
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('monthSelect').value = month;
            
            const data = monthlyData[month] || [];
            const monthLabel = new Date(month + '-01').toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            
            renderPodium(data);
            renderLeaderboard(data, `📊 ${monthLabel} Rankings`);
        }
        
        // Event listeners
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => selectFilter(btn.dataset.filter));
        });
        
        document.getElementById('monthSelect').addEventListener('change', (e) => {
            if (e.target.value) selectMonth(e.target.value);
        });
        
        // Initial render
        renderTrendChart();
        renderPodium(ytdData);
        renderLeaderboard(ytdData, '📊 YTD Rankings');
    </script>
</body>
</html>
