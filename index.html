<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👑 King of COR</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #FFD700; --silver: #C0C0C0; --bronze: #CD7F32;
            --green: #00C853; --orange: #FF9800; --purple: #9C27B0;
            --bg-dark: #0a1628; --bg-card: #1a2744;
            --text-light: #fff; --text-muted: #8899aa;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark), #1a2744);
            min-height: 100vh; color: var(--text-light);
        }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        
        .header { text-align: center; padding: 20px 0; }
        .header h1 {
            font-size: 2.5rem; font-weight: 800;
            background: linear-gradient(135deg, var(--gold), #FFA500);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header p { color: var(--text-muted); margin-top: 5px; }
        
        .section-title { font-size: 1rem; font-weight: 700; margin: 20px 0 10px; display: flex; align-items: center; gap: 8px; }
        
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 15px 0; }
        .stat { background: var(--bg-card); border-radius: 10px; padding: 12px; text-align: center; }
        .stat .num { font-size: 1.4rem; font-weight: 800; }
        .stat .num.orange { color: var(--orange); }
        .stat .num.green { color: var(--green); }
        .stat .num.purple { color: var(--purple); }
        .stat .lbl { color: var(--text-muted); font-size: 0.7rem; margin-top: 2px; }
        
        .ref-box {
            background: linear-gradient(135deg, rgba(156,39,176,0.2), rgba(156,39,176,0.1));
            border: 1px solid var(--purple); border-radius: 12px;
            padding: 15px; margin: 15px 0;
        }
        .ref-box h3 { color: var(--purple); font-size: 0.9rem; margin-bottom: 10px; }
        .ref-stats { display: flex; gap: 20px; }
        .ref-stat { text-align: center; }
        .ref-stat .n { font-size: 1.5rem; font-weight: 800; }
        .ref-stat .n.s { color: var(--orange); }
        .ref-stat .n.g { color: var(--green); }
        .ref-stat .l { font-size: 0.7rem; color: var(--text-muted); }
        
        .filters { display: flex; gap: 8px; margin: 15px 0; flex-wrap: wrap; justify-content: center; }
        .fbtn {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-light); padding: 8px 14px; border-radius: 20px;
            cursor: pointer; font-family: inherit; font-weight: 600; font-size: 0.8rem;
        }
        .fbtn:hover { background: rgba(0,200,83,0.2); }
        .fbtn.active { background: var(--green); color: #000; border-color: var(--green); }
        
        .chart { background: var(--bg-card); border-radius: 12px; padding: 15px; margin: 15px 0; }
        .chart h3 { margin-bottom: 10px; font-size: 0.9rem; }
        .bars { display: flex; align-items: flex-end; gap: 8px; height: 120px; }
        .bar-group { flex: 1; display: flex; gap: 2px; align-items: flex-end; position: relative; }
        .bar { width: 16px; border-radius: 3px 3px 0 0; cursor: pointer; }
        .bar.orange { background: var(--orange); }
        .bar.green { background: var(--green); }
        .bar-vals { position: absolute; top: -30px; left: 0; right: 0; text-align: center; font-size: 0.6rem; font-weight: 600; line-height: 1.2; }
        .bar-lbl { position: absolute; bottom: -18px; left: 0; right: 0; text-align: center; font-size: 0.65rem; color: var(--text-muted); }
        .legend { display: flex; justify-content: center; gap: 15px; margin-top: 22px; font-size: 0.7rem; }
        .leg { display: flex; align-items: center; gap: 4px; }
        .dot { width: 8px; height: 8px; border-radius: 2px; }
        
        .podium { display: flex; justify-content: center; gap: 12px; padding: 20px 0; align-items: flex-end; }
        .place { text-align: center; }
        .avatar {
            width: 50px; height: 50px; border-radius: 50%; background: var(--bg-card);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 1rem; margin: 0 auto 5px; border: 3px solid;
        }
        .place.p1 .avatar { width: 65px; height: 65px; border-color: var(--gold); box-shadow: 0 0 12px rgba(255,215,0,0.4); }
        .place.p2 .avatar { border-color: var(--silver); }
        .place.p3 .avatar { border-color: var(--bronze); }
        .place .name { font-weight: 700; font-size: 0.85rem; }
        .place .nums { font-size: 0.8rem; margin-top: 2px; }
        .place .nums .s { color: var(--orange); }
        .place .nums .g { color: var(--green); }
        .medal { font-size: 1.2rem; margin-bottom: 3px; }
        .stand { width: 60px; border-radius: 5px 5px 0 0; margin-top: 6px; }
        .place.p1 .stand { background: rgba(255,215,0,0.2); height: 70px; }
        .place.p2 .stand { background: rgba(192,192,192,0.2); height: 50px; }
        .place.p3 .stand { background: rgba(205,127,50,0.2); height: 30px; }
        
        .board { background: var(--bg-card); border-radius: 12px; overflow: hidden; margin-top: 12px; }
        .row { display: grid; grid-template-columns: 40px 1fr 55px 55px; padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .row:hover { background: rgba(0,200,83,0.08); }
        .row.hdr { background: rgba(0,0,0,0.3); font-weight: 600; color: var(--text-muted); font-size: 0.65rem; text-transform: uppercase; }
        .rank { font-weight: 700; font-size: 0.9rem; }
        .info { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; }
        .sm-av {
            width: 28px; height: 28px; border-radius: 50%;
            background: linear-gradient(135deg, #0066CC, #004494);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 0.65rem;
        }
        .col { text-align: center; font-weight: 700; font-size: 0.9rem; }
        .col.orange { color: var(--orange); }
        .col.green { color: var(--green); }
        
        .footer { text-align: center; padding: 18px; color: var(--text-muted); font-size: 0.7rem; }
        
        @media (max-width: 600px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
            .header h1 { font-size: 1.8rem; }
            .podium { flex-direction: column; align-items: center; }
            .place { order: 2; } .place.p1 { order: 1; }
        }
    </style>
</head>

        function renderChart() {
            const c = document.getElementById('bars');
            const maxS = Math.max(...chartData.map(d => d.iSigned));
            c.innerHTML = chartData.map(d => {
                const hS = Math.max((d.iSigned / maxS) * 90, 5);
                const hG = Math.max((d.iGreen / maxS) * 90, 5);
                return `<div class="bar-group" onclick="selectPeriod('${d.month}')">
                    <div class="bar-vals"><span style="color:var(--orange)">${d.iSigned}</span><br><span style="color:var(--green)">${d.iGreen}</span></div>
                    <div class="bar orange" style="height:${hS}px"></div>
                    <div class="bar green" style="height:${hG}px"></div>
                    <div class="bar-lbl">${d.label}</div>
                </div>`;
            }).join('');
        }
        
        function renderPodium(data) {
            const c = document.getElementById('podium');
            const t = data.slice(0, 3);
            if (t.length < 3) { c.innerHTML = ''; return; }
            c.innerHTML = `
                <div class="place p2"><div class="avatar">${t[1].initials}</div><div class="medal">🥈</div><div class="name">${t[1].name}</div><div class="nums"><span class="s">${t[1].signed}</span>/<span class="g">${t[1].green}</span></div><div class="stand"></div></div>
                <div class="place p1"><div class="avatar">${t[0].initials}</div><div class="medal">👑</div><div class="name">${t[0].name}</div><div class="nums"><span class="s">${t[0].signed}</span>/<span class="g">${t[0].green}</span></div><div class="stand"></div></div>
                <div class="place p3"><div class="avatar">${t[2].initials}</div><div class="medal">🥉</div><div class="name">${t[2].name}</div><div class="nums"><span class="s">${t[2].signed}</span>/<span class="g">${t[2].green}</span></div><div class="stand"></div></div>
            `;
        }
        
        function renderBoard(data) {
            const c = document.getElementById('board');
            const h = c.querySelector('.hdr');
            c.innerHTML = ''; c.appendChild(h);
            data.forEach((d, i) => {
                const row = document.createElement('div');
                row.className = 'row';
                const e = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : d.rank;
                row.innerHTML = `<div class="rank">${e}</div><div class="info"><div class="sm-av">${d.initials}</div>${d.name}</div><div class="col orange">${d.signed}</div><div class="col green">${d.green}</div>`;
                c.appendChild(row);
            });
            const tS = data.reduce((s, d) => s + d.signed, 0);
            const tG = data.reduce((s, d) => s + d.green, 0);
            document.getElementById('sSigned').textContent = tS.toLocaleString();
            document.getElementById('sGreen').textContent = tG.toLocaleString();
            document.getElementById('sRate').textContent = tS > 0 ? Math.round(tG/tS*100) + '%' : '0%';
            document.getElementById('sCount').textContent = data.length;
        }
        
        function updateRefs(period) {
            const r = period === 'ytd' ? ytdRefs : (monthlyRefs[period] || {signed: 0, green: 0});
            document.getElementById('rSigned').textContent = r.signed.toLocaleString();
            document.getElementById('rGreen').textContent = r.green.toLocaleString();
            document.getElementById('rRate').textContent = r.signed > 0 ? Math.round(r.green/r.signed*100) + '%' : '0%';
        }
        
        function selectPeriod(p) {
            document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
            document.querySelector(`[data-p="${p}"]`)?.classList.add('active');

            renderPodium(data); renderBoard(data); updateRefs(p);
        }
